# .github/workflows/update-db.yml
name: Update StellCoilBench Database

on:
  push:
    branches: [ main ]

# Queue new runs instead of canceling in-progress ones
# This ensures long-running cases always complete
concurrency:
  group: update-db-${{ github.ref }}
  cancel-in-progress: false

jobs:
  determine-cases:
    runs-on: ubuntu-24.04
    outputs:
      cases_to_run_json: ${{ steps.filter.outputs.cases_to_run_json }}
      has_cases: ${{ steps.filter.outputs.has_cases }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Filter cases to run
        id: filter
        run: |
          ALL_CASE_FILES=$(find cases -name "*.yaml" -type f | sort)
          
          if [ -z "$ALL_CASE_FILES" ]; then
            echo "ERROR: No .yaml files found in cases/ directory!"
            exit 1
          fi
          
          TEMP_CASES=$(mktemp)
          echo "$ALL_CASE_FILES" > "$TEMP_CASES"
          
          PYTHON_OUTPUT=$(python3 - "$TEMP_CASES" << 'PYTHON_SCRIPT'
          import sys
          import yaml
          import zipfile
          from pathlib import Path
          import json
          
          def normalize_yaml_content(content):
              try:
                  data = yaml.safe_load(content)
                  return yaml.dump(data, sort_keys=True, default_flow_style=False)
              except:
                  return content
          
          def case_has_successful_submission(case_file_path):
              case_path = Path(case_file_path)
              if not case_path.exists():
                  return False
              
              try:
                  current_case_content = case_path.read_text()
                  current_case_normalized = normalize_yaml_content(current_case_content)
              except Exception as e:
                  print(f"Warning: Failed to read case file {case_file_path}: {e}", file=sys.stderr)
                  return False
              
              try:
                  repo_root = Path.cwd()
                  case_file_rel = str(case_path.resolve().relative_to(repo_root.resolve()))
              except ValueError:
                  case_file_rel = str(case_path.resolve())
              
              case_file_rel_normalized = case_file_rel.replace("\\", "/")
              
              submissions_dir = Path("submissions")
              if not submissions_dir.exists():
                  return False
              
              zip_files = list(submissions_dir.rglob("*.zip"))
              if len(zip_files) == 0:
                  return False
              
              for zip_path in zip_files:
                  try:
                      with zipfile.ZipFile(zip_path, 'r') as zf:
                          if 'case.yaml' not in zf.namelist() or 'results.json' not in zf.namelist():
                              continue
                          
                          zip_case_content = zf.read('case.yaml').decode('utf-8')
                          zip_case_data = yaml.safe_load(zip_case_content)
                          
                          submission_source = zip_case_data.get('source_case_file', '')
                          if submission_source:
                              submission_source_normalized = submission_source.replace("\\", "/")
                              if (submission_source == case_file_rel or 
                                  submission_source_normalized == case_file_rel_normalized):
                                  zip_case_data_for_comparison = {k: v for k, v in zip_case_data.items() if k != 'source_case_file'}
                                  zip_case_normalized = yaml.dump(zip_case_data_for_comparison, sort_keys=True, default_flow_style=False)
                                  
                                  if zip_case_normalized == current_case_normalized:
                                      return True
                  except Exception as e:
                      print(f"Warning: Failed to process {zip_path}: {e}", file=sys.stderr)
                      continue
              
              return False
          
          if len(sys.argv) > 1:
              with open(sys.argv[1], 'r') as f:
                  case_files = [line.strip() for line in f if line.strip()]
          else:
              case_files = [line.strip() for line in sys.stdin if line.strip()]
          
          if not case_files:
              print("ERROR: No case files found!", file=sys.stderr)
              sys.exit(1)
          
          cases_to_run = []
          cases_already_successful = []
          
          for case_file in case_files:
              if case_has_successful_submission(case_file):
                  cases_already_successful.append(case_file)
                  print(f"SKIP: {case_file} (has successful submission)", file=sys.stderr)
              else:
                  cases_to_run.append(case_file)
                  print(f"RUN: {case_file} (new or no successful submission)", file=sys.stderr)
          
          result = {
              "to_run": cases_to_run,
              "already_successful": cases_already_successful
          }
          print(json.dumps(result))
          PYTHON_SCRIPT
          )
          
          rm -f "$TEMP_CASES"
          
          CASES_TO_RUN_JSON=$(echo "$PYTHON_OUTPUT" | python3 -c "import sys, json; data = json.load(sys.stdin); print(json.dumps(data['to_run']))")
          
          echo "cases_to_run_json<<EOF" >> $GITHUB_OUTPUT
          echo "$CASES_TO_RUN_JSON" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # Check if there are cases to run
          CASES_COUNT=$(echo "$CASES_TO_RUN_JSON" | python3 -c "import sys, json; print(len(json.load(sys.stdin)))")
          if [ "$CASES_COUNT" -gt 0 ]; then
            echo "has_cases=true" >> $GITHUB_OUTPUT
          else
            echo "has_cases=false" >> $GITHUB_OUTPUT
          fi
          
          echo ""
          echo "=== Case filtering results ==="
          echo "$PYTHON_OUTPUT" | python3 -c "import sys, json; data = json.load(sys.stdin); print(f\"Total cases: {len(data['to_run']) + len(data['already_successful'])}\"); print(f\"To run: {len(data['to_run'])}\"); print(f\"Skipped: {len(data['already_successful'])}\")"

  run-cases:
    needs: [determine-cases]
    if: needs.determine-cases.outputs.has_cases == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        case_file: ${{ fromJson(needs.determine-cases.outputs.cases_to_run_json) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: apt-get stuff needed for vmec
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran openmpi-bin libopenmpi-dev libnetcdf-dev libnetcdff-dev liblapack-dev libscalapack-mpi-dev libhdf5-dev libhdf5-serial-dev git m4 libfftw3-dev libboost-all-dev libopenblas-dev libgsl-dev graphviz graphviz-dev

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy cmake scikit-build f90nml ninja wheel setuptools pyevtk matplotlib mpi4py h5py
          pip install f90wrap

      - name: Download the VMEC2000 standalone repository
        run: git clone --depth=1 https://github.com/hiddensymmetries/VMEC2000.git

      - name: Add to LD_LIBRARY_PATH so scalapack etc can be found
        run: echo "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV

      - name: Install booz_xform
        run: pip install -v git+https://github.com/hiddenSymmetries/booz_xform

      - name: Install virtual-casing
        run: pip install -v git+https://github.com/hiddenSymmetries/virtual-casing

      - name: Download and build SIMPLE
        run: |
          git clone --depth=1 https://github.com/itpplasma/SIMPLE.git
          cd SIMPLE
          make -j$(nproc)
          cp build/simple.x ${{ github.workspace }}/simple.x

      - name: Configure and install VMEC2000 module
        run: |
          cd VMEC2000
          cp cmake/machines/ubuntu.json cmake_config_file.json
          pip install .

      - name: Install package
        run: pip install -e .

      - name: Check if surface file exists
        run: |
          SURFACE_NAME=$(grep -A 2 "surface_params:" "${{ matrix.case_file }}" | grep "surface:" | awk '{print $2}' | tr -d '"')
          if [ -n "$SURFACE_NAME" ]; then
            if [ ! -f "plasma_surfaces/$SURFACE_NAME" ] && [ ! -f "plasma_surfaces/${SURFACE_NAME,,}" ]; then
              echo "ERROR: Surface file '$SURFACE_NAME' not found in plasma_surfaces/"
              exit 1
            fi
          fi

      - name: Run case file
        timeout-minutes: 350
        env:
          MPLBACKEND: Agg
        run: |
          echo "=========================================="
          echo "Running case: ${{ matrix.case_file }}"
          echo "=========================================="
          stellcoilbench submit-case "${{ matrix.case_file }}"

      - name: Create artifact name from case file
        id: artifact-name
        run: |
          # Convert case file path to a valid artifact name
          # e.g., cases/basic_rotating_ellipse.yaml -> basic_rotating_ellipse
          CASE_NAME=$(basename "${{ matrix.case_file }}" .yaml)
          echo "name=$CASE_NAME" >> $GITHUB_OUTPUT

      - name: Upload submission as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission-${{ steps.artifact-name.outputs.name }}
          path: submissions/
          if-no-files-found: warn
          retention-days: 1

  commit-all:
    needs: [determine-cases, run-cases]
    if: always() && needs.determine-cases.outputs.has_cases == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package
        run: pip install -e .

      - name: Download all submission artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: submission-*

      - name: Merge artifacts into submissions directory
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts/ -type f | head -50
          
          echo ""
          echo "=== Merging into submissions/ ==="
          
          # Each artifact is in artifacts/submission-<name>/submissions/<surface>/<user>/<timestamp>/
          # We need to merge them all into the main submissions/ directory
          for artifact_dir in artifacts/submission-*/; do
            if [ -d "$artifact_dir" ]; then
              echo "Processing artifact: $artifact_dir"
              # The artifact contains the full submissions/ structure
              if [ -d "${artifact_dir}submissions" ]; then
                cp -r "${artifact_dir}submissions/"* submissions/ 2>/dev/null || true
              else
                # Files might be directly in artifact_dir
                cp -r "${artifact_dir}"* submissions/ 2>/dev/null || true
              fi
            fi
          done
          
          echo ""
          echo "=== All submissions after merge ==="
          find submissions -name "*.zip" -type f | sort

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "$GITHUB_ACTOR"

      - name: Commit all submissions
        run: |
          echo "=== Adding submissions to git ==="
          
          # Add all submission files
          git add -f submissions/ 2>/dev/null || true
          
          # Check if there are changes
          if git diff --staged --quiet; then
            echo "No new submissions to commit"
          else
            echo "Committing submissions..."
            git commit -m "chore: add CI-generated submissions"
            
            echo "Pushing to main..."
            git push origin main
            echo "Submissions committed successfully"
          fi

      - name: Generate and commit leaderboard
        run: |
          echo "=== Generating leaderboard ==="
          
          # Remove old leaderboard files
          rm -f docs/leaderboard.json
          if [ -d "docs/leaderboards" ]; then
            find docs/leaderboards -name "*.md" -type f -delete
          fi
          
          # Generate leaderboard
          stellcoilbench update-db 2>&1 | tee /tmp/update-db.log
          
          echo ""
          echo "=== Generated leaderboard files ==="
          ls -la docs/leaderboards/*.md 2>/dev/null || echo "No leaderboard files"
          
          # Add leaderboard files
          if [ -f "docs/leaderboard.json" ]; then
            git add docs/leaderboard.json
          fi
          if [ -d "docs/leaderboards" ]; then
            git add docs/leaderboards/*.md 2>/dev/null || true
          fi
          
          # Commit if there are changes
          if git diff --staged --quiet; then
            echo "No leaderboard changes to commit"
          else
            echo "Committing leaderboard..."
            git commit -m "chore: update StellCoilBench leaderboard"
            git push origin main
            echo "Leaderboard committed successfully"
          fi

      - name: Trigger ReadTheDocs build
        if: always()
        run: |
          if [ -n "${{ secrets.RTDS_WEBHOOK_URL }}" ] && [ -n "${{ secrets.RTDS_WEBHOOK_TOKEN }}" ]; then
            echo "Triggering ReadTheDocs build..."
            curl -X POST "${{ secrets.RTDS_WEBHOOK_URL }}" \
              -H "Authorization: token ${{ secrets.RTDS_WEBHOOK_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"branches": ["main"]}' || echo "Warning: Failed to trigger ReadTheDocs build"
          else
            echo "ReadTheDocs webhook not configured - skipping"
          fi

  # Job that runs when there are no cases to run (just update leaderboard from existing submissions)
  update-leaderboard-only:
    needs: [determine-cases]
    if: needs.determine-cases.outputs.has_cases == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package
        run: pip install -e .

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "$GITHUB_ACTOR"

      - name: Generate and commit leaderboard
        run: |
          echo "=== No new cases to run, updating leaderboard from existing submissions ==="
          
          # Remove old leaderboard files
          rm -f docs/leaderboard.json
          if [ -d "docs/leaderboards" ]; then
            find docs/leaderboards -name "*.md" -type f -delete
          fi
          
          # Generate leaderboard
          stellcoilbench update-db 2>&1 | tee /tmp/update-db.log
          
          # Add leaderboard files
          if [ -f "docs/leaderboard.json" ]; then
            git add docs/leaderboard.json
          fi
          if [ -d "docs/leaderboards" ]; then
            git add docs/leaderboards/*.md 2>/dev/null || true
          fi
          
          # Commit if there are changes
          if git diff --staged --quiet; then
            echo "No leaderboard changes to commit"
          else
            echo "Committing leaderboard..."
            git commit -m "chore: update StellCoilBench leaderboard"
            git push origin main
            echo "Leaderboard committed successfully"
          fi
