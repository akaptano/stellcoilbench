# .github/workflows/update-db-selfhosted.yml
# Self-hosted runner workflow: benchmark cases + nonstop CI autopilot.
#
# TRIGGER → JOB MAPPING:
#
#   push (human code / case changes):
#     determine-cases → run-cases → update-leaderboard   (benchmark path)
#     run-autopilot-cases  → propose-autopilot-batch      (autopilot path)
#
#   push (autopilot proposer commits cases/pending/):
#     run-autopilot-cases  → propose-autopilot-batch      (nonstop loop!)
#     benchmark jobs skipped (event_name==push but no new cases/*.yaml)
#
#   push (autopilot runner commits cases/done/ only):
#     SKIPPED entirely via paths-ignore
#
#   schedule (every 15 min) or workflow_dispatch:
#     run-autopilot-cases  → propose-autopilot-batch      (autopilot path only)
#
# The proposer's push of cases/pending/ intentionally triggers a new run
# so the runner picks up the cases immediately.  This creates the nonstop
# loop.  The batch barrier (proposer skips when pending is non-empty)
# prevents duplicate proposals.
name: StellCoilBench CI (Self-Hosted)

on:
  push:
    branches: [ main ]
    # Ignore autopilot result-only commits so they don't re-trigger the
    # benchmark pipeline.  cases/pending/** is intentionally NOT ignored:
    # when the proposer pushes new pending cases, that push must trigger a
    # run so the runner picks them up immediately (nonstop loop).
    paths-ignore:
      - 'cases/done/**'
      - 'PAUSE_AUTORUN'
  schedule:
    - cron: '*/15 * * * *'   # autopilot: every 15 minutes
  workflow_dispatch:

concurrency:
  group: stellcoilbench-selfhosted-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CONDA_ENV: stellcoilbench_vmec
  SIMPLE_EXECUTABLE: /Users/akaptanoglu/SIMPLE/build/simple.x

jobs:
  # ---- Standard benchmark path (only on push) ----
  determine-cases:
    if: github.repository == 'akaptano/stellcoilbench' && github.event_name == 'push'
    runs-on: self-hosted
    outputs:
      cases_to_run_json: ${{ steps.filter.outputs.cases_to_run_json }}
      has_cases: ${{ steps.filter.outputs.has_cases }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter cases to run
        id: filter
        shell: bash
        run: |
          # Source conda (supports both miniconda3 and anaconda3)
          for p in "$HOME/miniconda3" "$HOME/anaconda3" "/opt/homebrew/Caskroom/miniconda/base"; do
            [ -f "$p/etc/profile.d/conda.sh" ] && source "$p/etc/profile.d/conda.sh" && break
          done
          conda activate $CONDA_ENV
          pip install pyyaml --quiet 2>/dev/null || true
          
          ALL_CASE_FILES=$(find cases -name "*.yaml" -type f | sort)
          
          if [ -z "$ALL_CASE_FILES" ]; then
            echo "ERROR: No .yaml files found in cases/ directory!"
            exit 1
          fi
          
          # Create Python filter script (use .py suffix for clarity)
          TEMP_SCRIPT=$(mktemp).py
          echo 'import sys, yaml, zipfile, json
          from pathlib import Path

          # Fields added during submission that should be ignored when comparing
          SUBMISSION_FIELDS = ["source_case_file", "submission_timestamp", "submission_user"]

          def normalize_yaml_content(content, strip_submission_fields=False):
              try:
                  data = yaml.safe_load(content)
                  if strip_submission_fields and isinstance(data, dict):
                      for field in SUBMISSION_FIELDS:
                          data.pop(field, None)
                  return yaml.dump(data, sort_keys=True, default_flow_style=False)
              except:
                  return content

          def case_has_successful_submission(case_file_path):
              case_path = Path(case_file_path)
              if not case_path.exists():
                  return False
              try:
                  current_case_content = case_path.read_text()
                  current_case_normalized = normalize_yaml_content(current_case_content)
              except Exception as e:
                  return False
              try:
                  repo_root = Path.cwd()
                  case_file_rel = str(case_path.resolve().relative_to(repo_root.resolve()))
              except ValueError:
                  case_file_rel = str(case_path.resolve())
              case_file_rel_normalized = case_file_rel.replace("\\", "/")
              submissions_dir = Path("submissions")
              if not submissions_dir.exists():
                  return False
              zip_files = list(submissions_dir.rglob("*.zip"))
              if len(zip_files) == 0:
                  return False
              for zip_path in zip_files:
                  try:
                      with zipfile.ZipFile(zip_path, "r") as zf:
                          if "case.yaml" not in zf.namelist() or "results.json" not in zf.namelist():
                              continue
                          zip_case_content = zf.read("case.yaml").decode("utf-8")
                          zip_case_data = yaml.safe_load(zip_case_content)
                          submission_source = zip_case_data.get("source_case_file", "")
                          submission_source_normalized = submission_source.replace("\\", "/")
                          source_filename = Path(submission_source_normalized).name
                          case_filename = Path(case_file_rel_normalized).name
                          if submission_source_normalized == case_file_rel_normalized or source_filename == case_filename:
                              # Strip submission-specific fields before comparing
                              zip_case_normalized = normalize_yaml_content(zip_case_content, strip_submission_fields=True)
                              if zip_case_normalized == current_case_normalized:
                                  return True
                  except:
                      continue
              return False

          case_files = [line.strip() for line in sys.stdin if line.strip()]
          to_run = [cf for cf in case_files if not case_has_successful_submission(cf)]
          already_successful = [cf for cf in case_files if case_has_successful_submission(cf)]
          print(json.dumps({"to_run": to_run, "already_successful": already_successful}))' > "$TEMP_SCRIPT"
          
          PYTHON_OUTPUT=$(echo "$ALL_CASE_FILES" | python3 "$TEMP_SCRIPT")
          rm -f "$TEMP_SCRIPT"
          
          CASES_TO_RUN=$(echo "$PYTHON_OUTPUT" | python3 -c "import sys, json; data = json.load(sys.stdin); print(json.dumps(data['to_run']))")
          
          echo "cases_to_run_json=$CASES_TO_RUN" >> $GITHUB_OUTPUT
          
          if [ "$CASES_TO_RUN" = "[]" ]; then
            echo "has_cases=false" >> $GITHUB_OUTPUT
            echo "No cases need to be run - all have successful submissions"
          else
            echo "has_cases=true" >> $GITHUB_OUTPUT
            echo "Cases to run: $CASES_TO_RUN"
          fi

  run-cases:
    needs: [determine-cases]
    if: >
      github.repository == 'akaptano/stellcoilbench' &&
      github.event_name == 'push' &&
      needs.determine-cases.outputs.has_cases == 'true'
    runs-on: self-hosted
    timeout-minutes: 1440  # 24 hours
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install stellcoilbench
        shell: bash
        run: |
          # Source conda (supports both miniconda3 and anaconda3)
          for p in "$HOME/miniconda3" "$HOME/anaconda3" "/opt/homebrew/Caskroom/miniconda/base"; do
            [ -f "$p/etc/profile.d/conda.sh" ] && source "$p/etc/profile.d/conda.sh" && break
          done
          conda activate $CONDA_ENV
          pip install -e .

      - name: Run all cases in parallel
        shell: bash
        env:
          MPLBACKEND: Agg
          CASES_JSON: ${{ needs.determine-cases.outputs.cases_to_run_json }}
          PARALLEL_JOBS: "8"
        run: |
          # Source conda (supports both miniconda3 and anaconda3)
          for p in "$HOME/miniconda3" "$HOME/anaconda3" "/opt/homebrew/Caskroom/miniconda/base"; do
            [ -f "$p/etc/profile.d/conda.sh" ] && source "$p/etc/profile.d/conda.sh" && break
          done
          conda activate $CONDA_ENV
          
          echo "=========================================="
          echo "Running cases in parallel (max $PARALLEL_JOBS jobs)"
          echo "Cases: $CASES_JSON"
          echo "=========================================="
          
          if [ -f "$SIMPLE_EXECUTABLE" ]; then
            cp "$SIMPLE_EXECUTABLE" ./simple.x
            echo "Copied simple.x from $SIMPLE_EXECUTABLE"
          fi
          
          CASE_LIST=$(echo "$CASES_JSON" | python3 -c "import sys, json; print('\n'.join(json.load(sys.stdin)))")
          
          mkdir -p /tmp/stellcoilbench_logs
          
          # Create wrapper script using echo
          echo '#!/bin/bash
          CASE_FILE="$1"
          WORKSPACE="$2"
          CASE_NAME=$(basename "$CASE_FILE" .yaml)
          LOG_FILE="/tmp/stellcoilbench_logs/${CASE_NAME}.log"
          
          log() { echo "[$(date +%Y-%m-%d\ %H:%M:%S)] [$CASE_NAME] $1" | tee -a "$LOG_FILE"; }
          
          log "Starting..."
          # Source conda (supports both miniconda3 and anaconda3)
          for p in "$HOME/miniconda3" "$HOME/anaconda3" "/opt/homebrew/Caskroom/miniconda/base"; do
            [ -f "$p/etc/profile.d/conda.sh" ] && source "$p/etc/profile.d/conda.sh" && break
          done
          conda activate $CONDA_ENV || { log "ERROR: conda failed"; exit 1; }
          
          export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
          export MPLBACKEND=Agg PYTHONUNBUFFERED=1
          
          cd "$WORKSPACE"
          log "Running stellcoilbench..."
          
          python -u -m stellcoilbench.cli submit-case "$CASE_FILE" 2>&1 | tee -a "$LOG_FILE"
          EXIT_CODE=${PIPESTATUS[0]}
          
          if [ $EXIT_CODE -eq 0 ]; then
            log "SUCCESS"
          else
            log "FAILED (exit code $EXIT_CODE)"
            echo "=== FULL LOG FOR $CASE_FILE ===" && cat "$LOG_FILE"
          fi
          exit $EXIT_CODE' > /tmp/run_case.sh
          chmod +x /tmp/run_case.sh
          
          if command -v parallel &> /dev/null; then
            echo "Using GNU parallel"
            echo "$CASE_LIST" | parallel --will-cite -j $PARALLEL_JOBS --halt never \
              --ungroup --joblog /tmp/parallel.log \
              "CONDA_ENV=$CONDA_ENV /tmp/run_case.sh {} $PWD"
            echo "=== Parallel execution summary ===" && cat /tmp/parallel.log || true
          else
            echo "GNU parallel not found, using xargs"
            echo "$CASE_LIST" | xargs -P $PARALLEL_JOBS -I {} bash -c \
              "CONDA_ENV=$CONDA_ENV /tmp/run_case.sh '{}' '$PWD'"
          fi
          
          echo "=== All cases completed ==="
          echo "=== LOG FILES ===" && ls -la /tmp/stellcoilbench_logs/ || true

      - name: Show all logs on failure
        if: failure()
        shell: bash
        run: |
          echo "=== SHOWING ALL LOG FILES ==="
          for f in /tmp/stellcoilbench_logs/*.log; do
            [ -f "$f" ] && echo "=== $f ===" && cat "$f"
          done

      - name: Commit all submissions
        if: always()
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "$GITHUB_ACTOR"
          git add -f submissions/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No new submissions to commit"
          else
            git commit -m "chore: add CI-generated submissions (parallel run)"
            git pull --rebase origin main || { git rebase --abort 2>/dev/null; git pull origin main --no-edit; }
            git push origin main
            echo "Submissions committed"
          fi

  update-leaderboard:
    needs: [determine-cases, run-cases]
    if: >
      always() &&
      github.repository == 'akaptano/stellcoilbench' &&
      github.event_name == 'push' &&
      needs.determine-cases.outputs.has_cases == 'true'
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest changes
        run: git pull origin main

      - name: Generate leaderboard
        shell: bash
        run: |
          # Source conda (supports both miniconda3 and anaconda3)
          for p in "$HOME/miniconda3" "$HOME/anaconda3" "/opt/homebrew/Caskroom/miniconda/base"; do
            [ -f "$p/etc/profile.d/conda.sh" ] && source "$p/etc/profile.d/conda.sh" && break
          done
          conda activate $CONDA_ENV
          echo "=== Generating leaderboard ==="
          stellcoilbench update-db

      - name: Commit leaderboard
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "$GITHUB_ACTOR"
          git add docs/leaderboard.json docs/leaderboard.rst docs/leaderboards/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No leaderboard changes to commit"
          else
            git commit -m "chore: update StellCoilBench leaderboard"
            git pull --rebase origin main || git pull origin main --no-edit
            git push origin main
            echo "Leaderboard updated"
          fi

  # =========================================================================
  # Nonstop CI autopilot: run pending cases from cases/pending/*.json
  # =========================================================================
  run-autopilot-cases:
    if: github.repository == 'akaptano/stellcoilbench'
    runs-on: self-hosted
    timeout-minutes: 180
    outputs:
      ran_cases: ${{ steps.run.outputs.ran_cases }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for pending cases
        id: pending
        shell: bash
        run: |
          shopt -s nullglob
          files=(cases/pending/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No pending autopilot cases."
            echo "has_pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found ${#files[@]} pending autopilot case(s)."
            echo "has_pending=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run autopilot cases
        id: run
        if: steps.pending.outputs.has_pending == 'true'
        shell: bash
        env:
          MPLBACKEND: Agg
        run: |
          # Source conda
          for p in "$HOME/miniconda3" "$HOME/anaconda3" "/opt/homebrew/Caskroom/miniconda/base"; do
            [ -f "$p/etc/profile.d/conda.sh" ] && source "$p/etc/profile.d/conda.sh" && break
          done
          conda activate $CONDA_ENV
          pip install -e . --quiet 2>/dev/null || true

          if [ -f "$SIMPLE_EXECUTABLE" ]; then
            cp "$SIMPLE_EXECUTABLE" ./simple.x
          fi

          export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1

          shopt -s nullglob
          PENDING_FILES=(cases/pending/*.json)
          # Cap at 8 cases per batch
          COUNT=0
          PIDS=()
          CASE_FILES=()
          mkdir -p /tmp/autopilot_logs

          for CASE_FILE in "${PENDING_FILES[@]}"; do
            if [ $COUNT -ge 8 ]; then break; fi
            CASE_ID=$(basename "$CASE_FILE" .json)
            LOG="/tmp/autopilot_logs/${CASE_ID}.log"

            echo "Launching autopilot case: $CASE_ID"
            (
              stellcoilbench run-ci-case "$CASE_FILE" \
                --output-dir cases/done \
                --policy policy/proposer_policy.yaml \
                > "$LOG" 2>&1
              EXIT=$?
              if [ $EXIT -eq 0 ]; then
                echo "[OK]  $CASE_ID" >> /tmp/autopilot_logs/_status.txt
              else
                echo "[FAIL] $CASE_ID (exit $EXIT)" >> /tmp/autopilot_logs/_status.txt
              fi
              # Remove the pending file regardless of success/failure
              # (summary.json is written either way)
              rm -f "$CASE_FILE"
            ) &
            PIDS+=($!)
            CASE_FILES+=("$CASE_FILE")
            COUNT=$((COUNT + 1))
          done

          echo "Waiting for $COUNT autopilot case(s)..."
          for pid in "${PIDS[@]}"; do
            wait "$pid" || true
          done

          echo "=== Autopilot status ==="
          cat /tmp/autopilot_logs/_status.txt 2>/dev/null || echo "(no status)"

          echo "ran_cases=true" >> "$GITHUB_OUTPUT"

      - name: Show autopilot logs on failure
        if: failure()
        shell: bash
        run: |
          for f in /tmp/autopilot_logs/*.log; do
            [ -f "$f" ] && echo "=== $f ===" && cat "$f"
          done

      - name: Commit autopilot results
        if: steps.pending.outputs.has_pending == 'true'
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "ci-autopilot[bot]"
          # Add each path separately so a missing path doesn't block the others
          git add cases/done/  2>/dev/null || true
          git add cases/pending/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No autopilot results to commit"
          else
            git commit -m "ci: autopilot batch results"
            git pull --rebase origin main || { git rebase --abort 2>/dev/null; git pull origin main --no-edit; }
            git push origin main
            echo "Autopilot results committed"
          fi

  # =========================================================================
  # Nonstop CI autopilot: propose next batch
  # Runs on ALL event types (push, schedule, dispatch).  The proposer has
  # its own guards (PAUSE_AUTORUN, batch barrier, guardrails) so running
  # it on push is safe and solves the bootstrap problem: the first push
  # after merging the autopilot code immediately proposes 8 cases.
  # =========================================================================
  propose-autopilot-batch:
    needs: [run-autopilot-cases]
    if: >
      always() &&
      github.repository == 'akaptano/stellcoilbench'
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest (after autopilot run)
        run: git pull origin main

      - name: Propose batch
        shell: bash
        run: |
          # Exit early if paused
          if [ -f PAUSE_AUTORUN ]; then
            echo "PAUSE_AUTORUN file exists — skipping proposal."
            exit 0
          fi

          # Exit early if pending dir still has cases (shouldn't happen after
          # run-autopilot-cases, but safety check)
          shopt -s nullglob
          pending=(cases/pending/*.json)
          if [ ${#pending[@]} -gt 0 ]; then
            echo "Pending directory not empty (${#pending[@]} cases). Skipping."
            exit 0
          fi

          # Source conda
          for p in "$HOME/miniconda3" "$HOME/anaconda3" "/opt/homebrew/Caskroom/miniconda/base"; do
            [ -f "$p/etc/profile.d/conda.sh" ] && source "$p/etc/profile.d/conda.sh" && break
          done
          conda activate $CONDA_ENV

          python tools/propose_batch.py \
            --batch-size 8 \
            --done-dir cases/done \
            --pending-dir cases/pending \
            --policy policy/proposer_policy.yaml

      - name: Commit proposed cases
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "ci-autopilot[bot]"
          # Add each path separately so a missing PAUSE_AUTORUN doesn't
          # prevent cases/pending/ from being staged (git add fails entirely
          # if ANY pathspec is missing).
          git add cases/pending/ 2>/dev/null || true
          git add PAUSE_AUTORUN 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No new cases proposed"
          else
            git commit -m "ci: propose next autopilot batch"
            git pull --rebase origin main || { git rebase --abort 2>/dev/null; git pull origin main --no-edit; }
            git push origin main
            echo "Proposed cases committed"
          fi
