description: "Basic coil optimization for Landreman-Paul QH using augmented Lagrangian with constrained L-BFGS-B"
surface_params:
  surface: "input.LandremanPaul2021_QH_reactorScale_lowres"
  range: "half period"

coils_params:
  ncoils: 5
  order: 4

Fourier continuation:
  enabled: true
  orders: [4, 8, 16]

optimizer_params:
  # algorithm: "augmented_lagrangian"
  minimize_method: "L-BFGS-B"
  max_iterations: 1000
  # max_iter_subopt: 10
  verbose: True

# options for each term are l2, l2_threshold, l1, l1_threshold.
# Unspecified terms are not included in the objective function.
# Note that SquaredFlux is always included
coil_objective_terms: 
  length_threshold: 180.0
  total_length: "l2_threshold"  
  coil_curvature: "lp_threshold"  # options are lp, lp_threshold
  coil_curvature_p: 2  # defaults to 2 if not specified
  coil_mean_squared_curvature: "l2_threshold"  # options are l2, l2_threshold, l1, l1_threshold
  linking_number: ""  
  coil_arclength_variation: "l2_threshold"  # options are l2, l2_threshold, l1, l1_threshold
