description: "Dipole coil optimization with Landreman-Paul QA surface (TF + dipole array)"
surface_params:
  surface: "input.LandremanPaul2021_QA"
  range: "half period"

coils_params:
  coil_type: "dipole"
  Nx: 4
  dipole_order: 2
  fix_shapes: True
  fix_currents: True
  fix_center: True
  fix_orientation: True

optimizer_params:
  algorithm: "L-BFGS-B"
  max_iterations: 500
  verbose: True
