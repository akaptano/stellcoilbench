description: "Modular coil optimization for the Schuett-Henneberg quasi-axisymmetric ARIES-CS surface (nfp=2): 4 coils at order 8, L-BFGS-B, virtual casing enabled for B-field target, Boozer and Poincaré plots disabled due to surface geometry."
surface_params:
  surface: "wout_schuetthenneberg_nfp2.nc"
  virtual_casing: true

post_processing_params:
  plot_boozer: false
  plot_poincare: false

coils_params:
  ncoils: 4
  order: 8

optimizer_params:
  algorithm: "L-BFGS-B"
  max_iterations: 500

coil_objective_terms:
  length_threshold: 150.0