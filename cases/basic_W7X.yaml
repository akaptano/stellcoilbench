description: "Modular coil optimization for W7-X (Wendelstein 7-X) without coil ripple, beta=0.05, d23p4_tm configuration: 4 coils, L-BFGS-B, Fourier continuation from order 4 to 8, with reduced length/cc/cs thresholds (45 m, 0.25 m, 0.35 m) for short coils."
surface_params:
  surface: "input.W7-X_without_coil_ripple_beta0p05_d23p4_tm"

coils_params:
  ncoils: 4

fourier_continuation:
  enabled: true
  orders: [4, 8]

optimizer_params:
  algorithm: "L-BFGS-B"
  max_iterations: 1000

coil_objective_terms:
  length_threshold: 45.0
  cc_threshold: 0.25
  cs_threshold: 0.35
