description: "Modular coil optimization for the HSX (Helically Symmetric eXperiment) quasi-helically symmetric configuration (mn1824_ns101): 5 coils, L-BFGS-B, Fourier continuation from order 4 to 8, with length threshold 15 m."
surface_params:
  surface: "input.HSX_QHS_mn1824_ns101"

coils_params:
  ncoils: 5

fourier_continuation:
  enabled: true
  orders: [4, 8]

optimizer_params:
  algorithm: "L-BFGS-B"
  max_iterations: 1000

coil_objective_terms:
  length_threshold: 15.0

